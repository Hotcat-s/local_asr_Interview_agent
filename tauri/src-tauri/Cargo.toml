[package]
name = "local-interview-agent"
version = "2.0.0"
description = "Local-first interview review desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "local_interview_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
