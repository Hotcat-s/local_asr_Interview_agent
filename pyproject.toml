[project]
name = "local-interview-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "funasr>=1.3.16",
    "httpx[socks]>=0.28.1",
    "numpy>=1.26",
    "openai>=1.40",
    "pyside6>=6.11.1",
    "pyside6-fluent-widgets>=1.11.3",
    "soundfile>=0.12",
    "torch==2.5.1",
    "torchaudio==2.5.1",
]

[project.optional-dependencies]
# Optional: semantic segmentation via BGE sentence embeddings (heavier download).
embeddings = ["sentence-transformers>=3.0"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

